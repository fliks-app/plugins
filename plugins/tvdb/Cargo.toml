[package]
name = "fk-plugin-tvdb"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fliks-plugin-sdk = { workspace = true }
fliks-plugin-sdk-provider = { workspace = true }
serde_json = "1"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fliks-plugin-sdk = { workspace = true, features = ["build"] }
