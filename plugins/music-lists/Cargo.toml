[package]
name = "fk-plugin-music-lists"
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fliks-plugin-sdk = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fliks-plugin-sdk = { workspace = true, features = ["build"] }
