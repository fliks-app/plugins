[package]
name = "fk-plugin-notify"
version = "2.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fliks-plugin-sdk = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fliks-plugin-sdk = { workspace = true, features = ["harness"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
