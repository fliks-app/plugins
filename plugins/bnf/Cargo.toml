[package]
name = "fk-plugin-bnf"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
provider-common = { path = "../../crates/provider-common" }
fliks-plugin-sdk = { workspace = true }
fliks-plugin-sdk-provider = { workspace = true }
quick-xml = "0.42"
regex = "1"
serde_json = "1"
url = "2"

[dev-dependencies]
provider-common = { path = "../../crates/provider-common", features = ["golden"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fliks-plugin-sdk = { workspace = true, features = ["build"] }
