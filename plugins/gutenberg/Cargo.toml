[package]
name = "fk-plugin-gutenberg"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
direct-source = { path = "../../crates/direct-source" }
provider-common = { path = "../../crates/provider-common" }
fliks-plugin-sdk = { workspace = true }
fliks-plugin-sdk-provider = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fliks-plugin-sdk = { workspace = true, features = ["build"] }
