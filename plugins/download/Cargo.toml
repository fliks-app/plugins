[package]
name = "fk-plugin-download"
version = "2.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fliks-plugin-sdk = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
url = "2"
sha1 = { version = "0.10", default-features = false }
time = { version = "0.3", default-features = false, features = ["parsing", "std"] }

[dev-dependencies]
fliks-plugin-route = { workspace = true }

# Component tests of the built plugin under the real host (SDK-11).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fliks-plugin-sdk = { workspace = true, features = ["harness"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
