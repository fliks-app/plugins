[package]
name = "provider-common"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[features]
# Fixture replay for the golden tests of the plugins.
golden = []

[dependencies]
chrono = { version = "0.4", default-features = false }
fliks-plugin-sdk-provider = { workspace = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
url = "2"

[dev-dependencies]
provider-common = { path = ".", features = ["golden"] }
