name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Full debuginfo of the optimised deps fills the runner disk and the cache; file:line is enough.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  SQLX_OFFLINE: 'true'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.affected.outputs.plugins }}
      crates: ${{ steps.affected.outputs.crates }}
      release: ${{ steps.affected.outputs.release }}
      # More than 3 plugins share one runner and one build instead of a matrix of cold ones.
      bulk: ${{ steps.affected.outputs.plugins != '[]' && length(fromJSON(steps.affected.outputs.plugins)) > 3 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 .github/scripts/affected.py "$BASE" "$GITHUB_SHA"

  # Release PRs change versions and the changelog only: check the lockfile still matches.
  release-check:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo metadata --locked --format-version 1 > /dev/null

  # The shared library crates and xtask are native-only: no component to package.
  crates:
    needs: changes
    if: needs.changes.outputs.crates == 'true' && needs.changes.outputs.bulk != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plugins
          save-if: false
      - run: cargo fmt --all --check
      - run: cargo clippy -p provider-common -p direct-source -p xtask --all-targets -- -D warnings
      - run: cargo test -p provider-common -p direct-source

  verify:
    needs: changes
    if: needs.changes.outputs.plugins != '[]' && needs.changes.outputs.bulk != 'true'
    name: verify (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changes.outputs.plugins) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fliks
          POSTGRES_PASSWORD: fliks
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MANIFEST: ${{ matrix.plugin }}/Cargo.toml
      # Under CI the harness fails instead of skipping when this is missing.
      FLIKS_HARNESS_PG_URL: postgresql://fliks:fliks@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plugins
          save-if: false
      - run: cargo fmt --all --check
      - run: cargo clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings
      - run: cargo clippy --manifest-path "$MANIFEST" --target wasm32-wasip2 --all-targets -- -D warnings
      # The component tests load the release component.
      - run: cargo build --manifest-path "$MANIFEST" --release --target wasm32-wasip2
      - run: cargo test --manifest-path "$MANIFEST"
      - name: Verify the component and its archive (world, archive guard, 12 MiB budget)
        run: cargo xtask package "${{ matrix.plugin }}" --max-mib 12 --out dist

  verify-all:
    needs: changes
    if: needs.changes.outputs.bulk == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fliks
          POSTGRES_PASSWORD: fliks
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PLUGINS: ${{ join(fromJSON(needs.changes.outputs.plugins), ' ') }}
      FLIKS_HARNESS_PG_URL: postgresql://fliks:fliks@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      # A PR run saves the cache for its own reruns; pushes to main are saved by warm-cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plugins
          save-if: ${{ github.event_name == 'pull_request' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: |
          for p in $PLUGINS; do
            cargo clippy --manifest-path "$p/Cargo.toml" --target wasm32-wasip2 --all-targets -- -D warnings
            cargo build --manifest-path "$p/Cargo.toml" --release --target wasm32-wasip2
          done
      - run: cargo test --workspace
      - run: |
          for p in $PLUGINS; do cargo xtask package "$p" --max-mib 12 --out dist; done

  # Saves the one cache every job reads, built for every plugin; a verify job saving it would hold
  # only its own plugin's dependencies.
  warm-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plugins
      - run: cargo clippy --workspace --all-targets
      - run: |
          for m in plugins/*/Cargo.toml; do
            cargo clippy --manifest-path "$m" --target wasm32-wasip2 --all-targets
            cargo build --manifest-path "$m" --release --target wasm32-wasip2
          done
      - run: cargo test --workspace --no-run

  # The one check to require on main: green when every plugin job that ran is green.
  ci:
    needs: [changes, release-check, crates, verify, verify-all]
    if: always()
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
