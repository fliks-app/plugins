[workspace]
resolver = "3"
members = ["download", "notify", "providers/openlibrary", "xtask", "crates/book-providers"]

# One rev of fliks-app/fliks for every plugin; raising it rebuilds them all.
[workspace.dependencies]
fliks-plugin-sdk = { git = "https://github.com/fliks-app/fliks", rev = "506d300edfabf10e0604e49fd30517d7cd08a27a" }
fliks-plugin-sdk-provider = { git = "https://github.com/fliks-app/fliks", rev = "506d300edfabf10e0604e49fd30517d7cd08a27a" }
fliks-plugin-route = { git = "https://github.com/fliks-app/fliks", rev = "506d300edfabf10e0604e49fd30517d7cd08a27a" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Optimised deps: an unoptimised Cranelift makes every wasm compile in the harness tests minutes long.
[profile.dev.package."*"]
opt-level = 1
