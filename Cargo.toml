[workspace]
resolver = "3"
members = ["plugins/download", "plugins/notify", "plugins/openlibrary", "plugins/tmdb", "plugins/bnf", "plugins/googlebooks", "plugins/tvdb", "plugins/audible", "plugins/audnexus", "xtask", "crates/provider-common"]

# One rev of fliks-app/fliks for every plugin; raising it rebuilds them all.
[workspace.dependencies]
fliks-plugin-sdk = { git = "https://github.com/fliks-app/fliks", rev = "31d8a0ce75e26c2a2b9ebf449d545e25f3cc3762" }
fliks-plugin-sdk-provider = { git = "https://github.com/fliks-app/fliks", rev = "31d8a0ce75e26c2a2b9ebf449d545e25f3cc3762" }
fliks-plugin-route = { git = "https://github.com/fliks-app/fliks", rev = "31d8a0ce75e26c2a2b9ebf449d545e25f3cc3762" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Optimised deps: an unoptimised Cranelift makes every wasm compile in the harness tests minutes long.
[profile.dev.package."*"]
opt-level = 1
