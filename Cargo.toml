[workspace]
resolver = "3"
members = ["plugins/download", "plugins/notify", "plugins/openlibrary", "plugins/tmdb", "plugins/bnf", "plugins/googlebooks", "plugins/tvdb", "plugins/audible", "plugins/audnexus", "xtask", "crates/provider-common", "crates/direct-source", "plugins/gutenberg", "plugins/librivox", "plugins/metron", "plugins/comicvine", "plugins/thexem", "plugins/musicbrainz", "plugins/fanarttv", "plugins/music-lists", "plugins/lrclib"]

# One rev of fliks-app/fliks for every plugin; raising it rebuilds them all.
[workspace.dependencies]
fliks-plugin-sdk = { git = "https://github.com/fliks-app/fliks", rev = "7b9c61890cfdecbdfdbe88eb109326214c4a67f7" }
fliks-plugin-sdk-provider = { git = "https://github.com/fliks-app/fliks", rev = "7b9c61890cfdecbdfdbe88eb109326214c4a67f7" }
fliks-plugin-manifest = { git = "https://github.com/fliks-app/fliks", rev = "7b9c61890cfdecbdfdbe88eb109326214c4a67f7" }
fliks_domain = { git = "https://github.com/fliks-app/fliks", rev = "7b9c61890cfdecbdfdbe88eb109326214c4a67f7" }
fliks-plugin-route = { git = "https://github.com/fliks-app/fliks", rev = "7b9c61890cfdecbdfdbe88eb109326214c4a67f7" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Optimised deps: an unoptimised Cranelift makes every wasm compile in the harness tests minutes long.
[profile.dev.package."*"]
opt-level = 1
